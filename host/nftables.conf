#!/usr/sbin/nft -f
#
# WireGuard-шлюз: базовый фаервол + NAT44/NAT66 + логирование дропов.
# Хостовые интерфейсы: WAN=eth0, туннель=wg0.
#
flush ruleset

define WG_PORT = 38471
define WAN     = "eth0"
define WG      = "wg0"
define VPN4    = 10.8.0.0/24
define VPN6    = fd42:8:8::/64

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # учёт всего входящего из туннеля (видно в: nft list chain inet filter input)
        iifname $WG counter comment "wg0-in"
        ct state established,related accept
        iif lo accept

        ip protocol icmp accept
        meta l4proto ipv6-icmp accept

        # SSH: 8222 (рабочий) + 22 (временно, до подтверждения миграции)
        tcp dport { 22, 8222 } accept

        # WireGuard
        udp dport $WG_PORT counter accept comment "wg-udp-in"

        # DNS — только из туннеля (не открытый резолвер)
        iifname $WG udp dport 53 counter accept
        iifname $WG tcp dport 53 counter accept

        log prefix "nft-drop-INPUT: " limit rate 5/minute
        counter
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        # Ответы/established (в т.ч. eth0 -> wg0 для клиентских сессий)
        ct state established,related accept

        # Из туннеля в интернет. wg0 -> wg0 не разрешён => изоляция клиентов.
        # Счётчик ушедшего трафика (видно в: nft list chain inet filter forward).
        iifname $WG oifname $WAN counter accept comment "wg0->wan"

        log prefix "nft-drop-FORWARD: " limit rate 5/minute
        counter
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip saddr $VPN4 masquerade
    }
}

table ip6 nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip6 saddr $VPN6 masquerade
    }
}
